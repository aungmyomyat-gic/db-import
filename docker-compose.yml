services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      FLASK_DEBUG: "1"
      PYTHONUNBUFFERED: "1"
      BATCH_BASE_URL: "http://icl-core:8080"
    volumes:
      - .:/app                   # live source/templates; no rebuild for code/UI edits
      - ./data:/app/data          # persists db_config.json across rebuilds
    networks:
      - sazaby-network

networks:
  sazaby-network:
    external: true
    name: icl-lv-core-system_sazaby-network
